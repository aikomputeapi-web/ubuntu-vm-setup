<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<rect width="1080" height="1080" fill="#E8F0E5"/>
<!-- Top accent bar -->
<rect x="0" y="0" width="1080" height="12" fill="#8FBC8F"/>
<!-- Product placeholder -->
<rect x="340" y="120" width="400" height="400" fill="#B8D8BA" rx="20" stroke="#5A7D5A" stroke-width="2"/>
<text x="540" y="340" text-anchor="middle" font-family="Helvetica" font-size="60" fill="#5A7D5A">PRODUCT</text>
<!-- Product name -->
<text x="540" y="620" text-anchor="middle" font-family="Georgia, serif" font-size="44" fill="#2D3E2D" font-weight="bold">Product Name Here</text>
<!-- Price badge -->
<circle cx="540" cy="720" r="60" fill="#8FBC8F"/>
<text x="540" y="735" text-anchor="middle" font-family="Helvetica" font-size="32" fill="white" font-weight="bold">$29</text>
<!-- CTA -->
<rect x="390" y="850" width="300" height="60" fill="#5A7D5A" rx="30"/>
<text x="540" y="888" text-anchor="middle" font-family="Helvetica" font-size="24" fill="white">SHOP NOW</text>
<rect x="0" y="1068" width="1080" height="12" fill="#8FBC8F"/>
</svg>