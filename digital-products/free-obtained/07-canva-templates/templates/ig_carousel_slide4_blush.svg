<circle cx="540" cy="350" r="80" fill="#D4A5A5"/>
<text x="540" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="80" fill="white" font-weight="bold">3</text>
<!-- Description -->
<text x="540" y="550" text-anchor="middle" font-family="Helvetica" font-size="32" fill="#3D2B2B">Your tip description</text>
