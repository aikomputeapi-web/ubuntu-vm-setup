<text x="540" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="white" font-weight="bold">Tip 3: Title Here</text>
<!-- Content area -->
<rect x="80" y="140" width="920" height="1070" fill="#E8B4B8" rx="20" opacity="0.3"/>
