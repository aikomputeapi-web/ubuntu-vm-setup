<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#E8F0E5"/>
<!-- Header bar -->
<rect x="0" y="0" width="1080" height="80" fill="#8FBC8F"/>
<text x="540" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="white" font-weight="bold">Tip 1: Title Here</text>
<!-- Content area -->
<rect x="80" y="140" width="920" height="1070" fill="#B8D8BA" rx="20" opacity="0.3"/>
<!-- Number -->
<circle cx="540" cy="350" r="80" fill="#8FBC8F"/>
<text x="540" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="80" fill="white" font-weight="bold">1</text>
<!-- Description -->
<text x="540" y="550" text-anchor="middle" font-family="Helvetica" font-size="32" fill="#2D3E2D">Your tip description</text>
<text x="540" y="600" text-anchor="middle" font-family="Helvetica" font-size="32" fill="#2D3E2D">goes here, multiline</text>
<!-- Slide indicator -->
<text x="540" y="1250" text-anchor="middle" font-family="Helvetica" font-size="20" fill="#8FBC8F">1 / 3</text>
</svg>