<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#FAFAFA"/>
    <stop offset="100%" style="stop-color:#E5E5E5"/>
  </linearGradient>
</defs>
<rect width="1080" height="1080" fill="url(#bg)"/>
<!-- Decorative border -->
<rect x="40" y="40" width="1000" height="1000" fill="none" stroke="#4A4A4A" stroke-width="3" rx="20"/>
<!-- Quote marks -->
<text x="120" y="280" font-family="Georgia, serif" font-size="180" fill="#999999" opacity="0.4">"</text>
<!-- Main quote text -->
<text x="540" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="52" fill="#1A1A1A" font-weight="bold">Your Quote Here</text>
<text x="540" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="52" fill="#1A1A1A" font-weight="bold">Second Line</text>
<!-- Divider -->
<line x1="440" y1="600" x2="640" y2="600" stroke="#999999" stroke-width="3"/>
<!-- Attribution -->
<text x="540" y="680" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="28" fill="#4A4A4A">— Author Name —</text>
<!-- Bottom branding -->
<text x="540" y="960" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="22" fill="#999999">@yourbrand</text>
</svg>