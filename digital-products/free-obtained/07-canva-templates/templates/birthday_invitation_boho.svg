<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<defs><radialGradient id="bg" cx="50%" cy="50%" r="70%">
<stop offset="0%" style="stop-color:#D4A574"/><stop offset="100%" style="stop-color:#F5EBE0"/></radialGradient></defs>
<rect width="1080" height="1080" fill="url(#bg)"/>
<!-- Confetti -->
<circle cx="200" cy="150" r="12" fill="#C49B6C"/>
<circle cx="850" cy="120" r="15" fill="#8B5E3C"/>
<circle cx="150" cy="800" r="10" fill="#8B5E3C"/>
<circle cx="900" cy="700" r="14" fill="#C49B6C"/>
<rect x="300" y="100" width="20" height="20" fill="#8B5E3C" transform="rotate(45 310 110)"/>
<rect x="750" y="850" width="18" height="18" fill="#C49B6C" transform="rotate(30 759 859)"/>
<!-- Title -->
<text x="540" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#8B5E3C">YOU'RE INVITED TO</text>
<!-- Birthday person name -->
<text x="540" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="72" fill="#5C3D2E" font-weight="bold">BIRTHDAY</text>
<text x="540" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="56" fill="#5C3D2E" font-weight="bold">PARTY!</text>
<!-- Details -->
<text x="540" y="640" text-anchor="middle" font-family="Helvetica" font-size="28" fill="#8B5E3C">Join us to celebrate</text>
<text x="540" y="680" text-anchor="middle" font-family="Georgia, serif" font-size="40" fill="#5C3D2E">[Name's] Special Day</text>
<!-- When & Where -->
<text x="540" y="780" text-anchor="middle" font-family="Helvetica" font-size="24" fill="#8B5E3C">Saturday, March 15, 2026 at 2:00 PM</text>
<text x="540" y="820" text-anchor="middle" font-family="Helvetica" font-size="24" fill="#8B5E3C">Party Venue, 123 Main Street</text>
<!-- RSVP -->
<text x="540" y="920" text-anchor="middle" font-family="Helvetica" font-size="22" fill="#C49B6C">RSVP: your@email.com</text>
</svg>