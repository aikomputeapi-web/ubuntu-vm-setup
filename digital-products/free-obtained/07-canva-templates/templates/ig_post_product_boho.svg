<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<rect width="1080" height="1080" fill="#F5EBE0"/>
<!-- Top accent bar -->
<rect x="0" y="0" width="1080" height="12" fill="#C49B6C"/>
<!-- Product placeholder -->
<rect x="340" y="120" width="400" height="400" fill="#D4A574" rx="20" stroke="#8B5E3C" stroke-width="2"/>
<text x="540" y="340" text-anchor="middle" font-family="Helvetica" font-size="60" fill="#8B5E3C">PRODUCT</text>
<!-- Product name -->
<text x="540" y="620" text-anchor="middle" font-family="Georgia, serif" font-size="44" fill="#5C3D2E" font-weight="bold">Product Name Here</text>
<!-- Price badge -->
<circle cx="540" cy="720" r="60" fill="#C49B6C"/>
<text x="540" y="735" text-anchor="middle" font-family="Helvetica" font-size="32" fill="white" font-weight="bold">$29</text>
<!-- CTA -->
<rect x="390" y="850" width="300" height="60" fill="#8B5E3C" rx="30"/>
<text x="540" y="888" text-anchor="middle" font-family="Helvetica" font-size="24" fill="white">SHOP NOW</text>
<rect x="0" y="1068" width="1080" height="12" fill="#C49B6C"/>
</svg>